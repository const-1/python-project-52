{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>Вы уверены, что хотите удалить задачу "{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">{{ button_text }}</button>
    <a href="{% url 'tasks:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
