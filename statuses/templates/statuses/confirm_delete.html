{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<p>
    {% trans "Are you sure you want to delete status" %}
    "{{ object.name }}"?
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        {{ button_text }}
    </button>
    <a href="{% url 'statuses:list' %}"
       class="btn btn-secondary">
        {% trans "Cancel" %}
    </a>
</form>
{% endblock %}
